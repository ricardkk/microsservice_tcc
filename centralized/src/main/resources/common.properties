spring.main.banner-mode=off
logging.structured.format.console=logstash
logging.structured.json.rename.[@timestamp]=timestamp
logging.structured.json.add.service=${spring.application.name}
logging.structured.json.stacktrace.max-length=6000
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
server.error.include-message=never
http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:1000}
http.read-timeout-ms=${HTTP_READ_TIMEOUT_MS:2000}
fault.enabled=${FAULT_ENABLED:false}
fault.delay-ms=${FAULT_DELAY_MS:5000}
logging.level.root=INFO
logging.level.common=INFO
logging.level.gateway=INFO
logging.level.order=INFO
logging.level.product=INFO
logging.level.user=INFO
