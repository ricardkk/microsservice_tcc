[SERVICE]
    Flush                     1
    Log_Level                 info
    Parsers_File              /fluent-bit/config/parsers.conf
    HTTP_Server               On
    HTTP_Listen               0.0.0.0
    HTTP_Port                 2020
    Health_Check              On
    storage.path              /var/lib/fluent-bit/storage
    storage.sync              normal
    storage.checksum          On
    storage.backlog.mem_limit 16M

[INPUT]
    Name                      tail
    Tag                       tcc.docker
    Path                      /var/log/docker/*/*-json.log
    multiline.parser          docker
    DB                        /var/lib/fluent-bit/tail.db
    Read_from_Head            On
    Refresh_Interval          1
    Rotate_Wait               10
    Buffer_Chunk_Size         64k
    Buffer_Max_Size           2M
    storage.type              filesystem

[FILTER]
    Name                      grep
    Match                     tcc.*
    Regex                     $attrs['tcc.stack'] ^centralized$
    Regex                     $attrs['tcc.service'] ^(gateway|user-service|product-service|order-service)$

[FILTER]
    Name                      parser
    Match                     tcc.*
    Key_Name                  log
    Parser                    spring-json
    Reserve_Data              On
    Preserve_Key              Off

[FILTER]
    Name                      lua
    Match                     tcc.*
    script                    /fluent-bit/config/normalize.lua
    call                      normalize
    time_as_table             On

[OUTPUT]
    Name                      loki
    Match                     tcc.*
    Host                      loki
    Port                      3100
    Labels                    job=tcc,service=$loki_service
    Line_Format               json
    Retry_Limit               False
    storage.total_limit_size  128M
