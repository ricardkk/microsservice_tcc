spring.application.name=order-service
spring.config.import=classpath:common.properties
server.port=${PORT:8083}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/orders_db}
spring.datasource.username=${DB_USER:tcc}
spring.datasource.password=${DB_PASSWORD:tcc}
spring.datasource.hikari.connection-timeout=2000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
services.user-url=${USER_SERVICE_URL:http://localhost:8081}
services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
spring.flyway.locations=classpath:db/migration/order
