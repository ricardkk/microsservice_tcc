spring.application.name=user-service
spring.config.import=classpath:common.properties
server.port=${PORT:8081}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5431/users_db}
spring.datasource.username=${DB_USER:tcc}
spring.datasource.password=${DB_PASSWORD:tcc}
spring.datasource.hikari.connection-timeout=2000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/user
