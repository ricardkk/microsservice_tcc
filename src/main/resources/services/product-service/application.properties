spring.application.name=product-service
spring.config.import=classpath:common.properties
server.port=${PORT:8082}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/products_db}
spring.datasource.username=${DB_USER:tcc}
spring.datasource.password=${DB_PASSWORD:tcc}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:1000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/product
